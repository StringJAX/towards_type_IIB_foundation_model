# Read the Docs build configuration. Layout as in JAXVacua: `documentation/` is the build root with a `source/`
# subdirectory and a sibling `requirements.txt`. See https://docs.readthedocs.io/en/stable/config-file/v2.html.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: documentation/source/conf.py
  fail_on_warning: true

# The API pages import the code, so install the runtime dependencies (CPU) after the documentation toolchain.
python:
  install:
    - requirements: documentation/requirements.txt
    - requirements: documentation/requirements-torch-cpu.txt
    - requirements: requirements-cpu.txt
